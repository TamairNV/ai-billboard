name: billboard
services:
  billboard:
    build: .
    container_name: billboard
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    # Localhost only: public through tunnel "house" at billboard.tamairnv.co.uk; /admin behind Cloudflare Access.
    ports:
      - "127.0.0.1:8102:8000"
    env_file: .env
    environment:
      - TZ=Europe/London
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
networks:
  default:
    name: billboard-net  # the infra MCP container joins this to post notes as "local"
